# Supabase project configuration
# https://supabase.com/docs/guides/local-development/cli/config

project_id = "cosmo"

# ─── Edge Functions ─────────────────────────────────────────────────
# Stripe posts webhook events without a Supabase JWT — it authenticates the
# request via the `stripe-signature` header, which the handler verifies with
# the webhook secret. Leaving the default `verify_jwt = true` would have
# Supabase reject Stripe with 401 before the signature check ever ran.
[functions.stripe-webhook]
verify_jwt = false

# stripe-create-checkout requires the user's JWT (we use it to identify which
# subscription row to upsert) — keep the default verify_jwt = true.
[functions.stripe-create-checkout]
verify_jwt = true

# delete-account requires the user's JWT (we resolve which user to purge
# from the JWT, never from request body) — keep verify_jwt = true.
[functions.delete-account]
verify_jwt = true

# stripe-org-checkout and stripe-org-portal both resolve the caller from their
# JWT and then check they own the organization they are acting on — the org id
# arrives in the request body and is never trusted on its own. Keep
# verify_jwt = true: without it, an unauthenticated request would reach the
# handler and the owner check would be comparing against a null user.
[functions.stripe-org-checkout]
verify_jwt = true

[functions.stripe-org-portal]
verify_jwt = true

# report-bug relaie un formulaire vers une boîte mail : il n'y a rien à
# autoriser en base, mais on garde verify_jwt = true pour que la passerelle
# exige au minimum une clé du projet. Un visiteur non connecté passe avec la
# clé anon (c'est voulu : un bug se signale aussi depuis un compte cassé) et
# reste anonyme dans le mail ; un utilisateur connecté est identifié par son
# JWT, jamais par le corps de la requête.
[functions.report-bug]
verify_jwt = true

# renewal-notice n est appelee par AUCUN utilisateur : c est un travail
# quotidien declenche par la CI. Elle n a donc pas de JWT a verifier, et son
# autorisation repose sur le secret partage CRON_SECRET, verifie dans le corps
# de la fonction. Sans cette ligne, la CI recevrait un 401 de la plateforme
# avant meme d atteindre le code.
[functions.renewal-notice]
verify_jwt = false

# seat-alert (alerte 80 % des sieges, mig. 240) est appelee par la CI avec
# CRON_SECRET, jamais par un utilisateur.
[functions.seat-alert]
verify_jwt = false

# send-org-invite (audit entreprise 2026-09-23, M11) resolves the inviter from
# the JWT and checks, per link, that they created it or administer the org.
[functions.send-org-invite]
verify_jwt = true

# org-digest is called by .github/workflows/org-digest.yml with CRON_SECRET,
# never by a user: the secret is what authorizes it.
[functions.org-digest]
verify_jwt = false

# inactive-accounts (C-121, mig. 226) is called by
# .github/workflows/inactive-accounts.yml with CRON_SECRET, never by a user.
[functions.inactive-accounts]
verify_jwt = false

# org-webhook-dispatch (mig. 199) is called by
# .github/workflows/org-webhook-dispatch.yml with CRON_SECRET, never by a user.
# 🔴 A-3 (2026-09-30) : this entry was MISSING, so the function was deployed
# with the default verify_jwt = true. The workflow sends no Authorization
# header, and the gateway answered 401 before the code ran: not a single
# webhook has ever been delivered. Redeploy AFTER mig. 207 (A-6), which is
# what makes a real delivery safe.
[functions.org-webhook-dispatch]
verify_jwt = false

# stripe-org-refund (2026-11-01) is ADMIN ONLY: it resolves the caller from the
# JWT and requires is_admin() (allowlist + aal2) before any Stripe call.
[functions.stripe-org-refund]
verify_jwt = true

# stripe-org-subscription (2026-11-01): withdrawal and cancellation, owner only,
# resolved from the JWT.
[functions.stripe-org-subscription]
verify_jwt = true

# verify-org-domain (mig. 195) resolves the caller from the JWT and checks they
# are an active admin of the domain's organization.
[functions.verify-org-domain]
verify_jwt = true

# affiliation-api (mig. 236) is called by cosmo-analytics with either an
# X-Affiliation-Token (shared code) or an admin JWT (is_admin(), aal2); /session
# and /click are public. The function checks auth itself, so the gateway must
# not demand a JWT.
[functions.affiliation-api]
verify_jwt = false

# analytics-admin-login: TOTP-only admin login for the cosmo-analytics app. The
# caller has no session yet, so the gateway must not demand a JWT; the function
# checks the Origin, rate-limits (fail closed) and verifies the code itself.
[functions.analytics-admin-login]
verify_jwt = false
