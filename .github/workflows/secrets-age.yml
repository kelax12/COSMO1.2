# ──────────────────────────────────────────────────────────────────────
# L'AGE des secrets, contre une echeance ecrite (AM-3, M-54).
#
# `docs/SECURITY.md` disait comment faire tourner un secret, jamais quand, et
# rien ne mesurait leur age. Ce job compare le registre
# `.github/secrets-registry.json` (NOMS SEULEMENT) a la realite : secrets
# GitHub Actions, secrets Edge Functions, variables Vercel, `.env.example`.
# Il echoue quand un secret depasse son echeance, quand sa date est inconnue,
# quand il existe sans entree au registre, ou l'inverse.
#
# Planifie et jamais sur push : un secret vieillit sans commit. Son rouge
# remonte par `ci-alert.yml` (liste `workflows:`), donc par le webhook ops.
#
# 🔴 Echec FERME. Pas de `if: secrets.X != ''`, pas de `continue-on-error` :
# un jeton absent sort en 1 (cf. CLAUDE.md, « une garde conditionnelle a la
# presence de son propre secret »).
# `SECRETS_AUDIT_TOKEN` : PAT fin (Settings -> Developer settings), depot
# seul, permission « Secrets: Read-only ». Le GITHUB_TOKEN du job ne peut pas
# lister les secrets du depot.
# ──────────────────────────────────────────────────────────────────────
name: Secrets age

on:
  schedule:
    - cron: '17 6 * * 1' # tous les lundis, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-age
  cancel-in-progress: true

jobs:
  age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Mesurer l age des secrets
        env:
          GH_TOKEN: ${{ secrets.SECRETS_AUDIT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ secrets.VERCEL_TEAM_ID }}
        run: node scripts/check-secrets-age.mjs

      # Le temoin, apres la mesure et quoi qu'il arrive : un temoin qui ne
      # joue que sur un run vert ne dit rien le jour du rouge. Il demande
      # vitest, d'ou l'installation ici et pas avant la mesure.
      - name: Temoin · la garde refuse-t-elle encore ce qu'elle doit refuser ?
        if: ${{ always() }}
        run: |
          npm ci
          npx vitest run scripts/check-secrets-age.guard.test.mjs
