# ══════════════════════════════════════════════════════════════════
# C-95 — RÉGRESSION VISUELLE : quatre thèmes, états vides et d'erreur
# ══════════════════════════════════════════════════════════════════
#
# 🔴 L'ANGLE MORT LE PLUS LARGE d'`UI-PATTERNS.md`. Rien ne voit un écran qui
# se déforme tant qu'aucun test fonctionnel ne casse. Et le produit a QUATRE
# thèmes dont les parcours e2e n'en jouent qu'UN — alors que la classe de bug
# du 2026-07-23 (dix-sept fichiers aux couleurs codées en dur) vient
# exactement de là : `.dark` est posée pour `sombre`, `gris` ET `noir`, donc
# un thème testé n'en teste pas trois.
#
# ── LE BOOTSTRAP, ET POURQUOI IL EST ÉCRIT ICI ─────────────────────
#
# Une garde visuelle a besoin de RÉFÉRENCES, et les références n'existent pas
# avant le premier run. Trois façons de s'en sortir, deux mauvaises :
#
#   ❌ les produire sur un poste de développement — le rendu des polices
#      diffère entre Windows et Linux bien au-delà du seuil de tolérance, la
#      CI serait rouge sur CHAQUE capture, et la réponse serait de désarmer
#      la garde ;
#   ❌ laisser le job rouge jusqu'à ce que quelqu'un y pense — un rouge
#      permanent finit ignoré, et il rend muets les jobs voisins ;
#   ✅ LES PRODUIRE SUR LE RUNNER LINUX, par `captures-regenerer.yml`, qui les
#      pousse sur une branche `noyau/captures-<run>` avec un artefact de
#      revue (V15.4, FRO-02). CE WORKFLOW-CI NE COMMITE PLUS RIEN :
#      avant la vague 15.4, il régénérait seul et poussait sur `main` quatorze
#      captures sans que personne ait vu ce qui changeait.
#
# ⚠️ CE QUE CE BOOTSTRAP NE GARANTIT PAS, et il faut le dire : la première
# référence fige l'écran TEL QU'IL EST, défauts compris. Elle ne dit pas que
# l'écran est juste, elle dit qu'à partir de maintenant on saura qu'il a
# changé. C'est la nature de cette famille de gardes, pas une faiblesse de
# celle-ci.
#
# ── COMMENT LIRE UN ROUGE ───────────────────────────────────────────
#
# Il dit « ça a changé », jamais « c'est cassé ». Trois suites, à choisir
# explicitement :
#   1. changement VOULU → lancer `Captures regenerer`, relire son artefact
#      `captures-revue`, ramener la branche sur `main` avec le trailer
#      `Captures-relues: <URL du run>` (`e2e/CLAUDE.md`) ; CI noyau refuse
#      sinon ;
#   2. changement NON VOULU → c'est une régression, corriger le produit ;
#   3. BRUIT de rendu → discuter le seuil (`maxDiffPixelRatio`, justifié dans
#      l'en-tête du spec), et surtout pas écraser la référence.
# ❌ Ne JAMAIS régénérer « pour faire passer la CI » : on efface alors la
#    seule trace de ce qui a bougé.
#
# Les rapports (images attendues, obtenues, et leur diff) sont téléversés en
# artefact à chaque échec : c'est là qu'on regarde avant de décider.
# ══════════════════════════════════════════════════════════════════
name: Visual

on:
  pull_request:
    branches: [main]
    # Uniquement quand quelque chose de VISIBLE bouge. Une garde visuelle qui
    # tourne sur un changement de script CI coûte du temps sans jamais rien
    # dire.
    paths:
      - 'src/**'
      - 'e2e/visual-regression.spec.ts'
      - 'playwright.config.ts'
      - 'tailwind.config.js'
      - 'index.html'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  captures:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # Le project `visual` dépend de `mobile-chrome-warmup`, qui paie la
      # compilation à froid de Vite une fois, sous un nom qui le dit, et sous
      # CHROMIUM. 🔴 C-115 : il dépendait de `mobile-safari-warmup`, et ce
      # commentaire affirmait que ce warmup ne demandait pas WebKit. Il tourne
      # sur un iPhone 12 : 19 runs, 19 échecs, aucune référence produite.
      # Sans référence, rien ne se compare : c'est un ÉCHEC, jamais un bootstrap
      # silencieux sur `main`. Les produire : `captures-regenerer.yml`.
      - name: Existe-t-il des references ?
        id: ref
        run: |
          set -euo pipefail
          if [ -d e2e/__screenshots__/linux ] && [ -n "$(ls -A e2e/__screenshots__/linux 2>/dev/null)" ]; then
            echo "$(ls e2e/__screenshots__/linux | wc -l) reference(s) presente(s)."
          else
            echo "::error title=visual::Aucune reference : lancer le workflow Captures regenerer, relire son artefact, ramener la branche sur main (e2e/CLAUDE.md)."
            exit 1
          fi

      # ── Comparer ──────────────────────────────────────────────────
      - name: Comparer aux references
        run: |
          set -o pipefail
          if npx playwright test --project=visual 2>&1 | tee visual.log; then
            {
              echo '### Regression visuelle — aucun ecart'
              echo ''
              echo '```'
              tail -n 15 visual.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### ✖ Un ecran a CHANGE'
            echo ''
            echo 'Un rouge ici dit « ca a change », jamais « c est casse ». Ouvrir'
            echo 'l artefact `visual-report` pour voir attendu / obtenu / diff, PUIS decider :'
            echo 'regression a corriger, changement voulu a regenerer, ou bruit de rendu.'
            echo ''
            echo '```'
            tail -n 60 visual.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 20 visual.log | while IFS= read -r LIGNE; do
            echo "::error title=visual::${LIGNE}"
          done
          exit 1

      - name: Rapport Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
