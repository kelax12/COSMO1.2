# ══════════════════════════════════════════════════════════════════
# Export QUOTIDIEN de la base, HORS du fournisseur.
#
# POURQUOI, alors que Supabase sauvegarde déjà : parce que les sauvegardes de
# Supabase vivent chez Supabase. Elles couvrent la panne et l'erreur de
# manipulation ; elles ne couvrent pas la perte du COMPTE — suspension,
# facturation impayée, litige, ou simplement l'envie de partir. C'est le « plan
# de sortie fournisseur » de docs/SCALABILITY.md, et il ne vaut que s'il est
# automatique : un export qu'on lance à la main n'est jamais à jour le jour où
# on en a besoin.
#
# 🔴 PASSÉ EN QUOTIDIEN LE 2026-08-29, et la raison a changé. Tant qu'un plan
# Pro était prévu, ce dump complétait le PITR et un rythme mensuel suffisait.
# La décision de RESTER EN PLAN FREE le rend seul de son espèce : le Free
# n'offre AUCUNE sauvegarde, donc ce fichier est la seule copie qui existe.
# Un RPO de trente jours n'est pas acceptable pour une copie unique ; à un jour,
# il vaut ce que Supabase inclut dans son plan Pro, moins la restauration en un
# clic et moins le point-in-time.
#
# Le coût est mesuré, pas supposé : la base fait 19 Mo dont ~2,5 Mo de données
# réelles, et `--format=custom` compresse. Un dump quotidien pèse donc une
# fraction de pour-cent du quota d'egress de 5 Go/mois. ⚠️ À re-mesurer si la
# base grossit d'un ordre de grandeur : ce workflow consomme le quota qui, lui,
# est la vraie limite du plan Free.
#
# 🔴 L'ARTEFACT CONTIENT DES DONNÉES PERSONNELLES — noms, adresses email,
# contenu des tâches. Trois conséquences, toutes appliquées ci-dessous :
#   • rétention courte (30 jours), qui donne trente points de restauration
#     glissants depuis le passage en quotidien ;
#   • 🔴 LE DUMP EST CHIFFRÉ AVANT TOUT DÉPÔT (2026-10-13). Le dépôt est PUBLIC,
#     et un artefact d'un dépôt public se télécharge depuis N'IMPORTE QUEL
#     compte GitHub connecté. Cette ligne affirmait l'inverse (« les artefacts
#     ne le sont pas »), et 29 dumps EN CLAIR sont restés exposés du 2026-08-29
#     au 2026-10-13 (violation de données, docs/RGPD-VIOLATION.md, registre).
#     Seul `*.dump.gpg` (AES-256, phrase secrète `BACKUP_PASSPHRASE`) part en
#     artefact ; le fichier en clair ne quitte jamais le runner ;
#   • ❌ JAMAIS de repli « en clair » si la phrase secrète manque : le job
#     ÉCHOUE. Une sauvegarde absente se voit ; une sauvegarde publique, non ;
#   • Ne JAMAIS committer le dump. GitHub n'est pas un coffre.
#
# MISE EN SERVICE : poser les secrets `SUPABASE_DB_URL` (Dashboard → Settings →
# Database → Connection string, en mode « session ») et `BACKUP_PASSPHRASE`
# (copie hors dépôt chez Axel, sans laquelle aucun dump ne se relit). Sans
# `SUPABASE_DB_URL` le job s'arrête en avertissement — une CI rouge en
# permanence finit ignorée, c'est la règle déjà écrite pour `renewal-notice`.
# Sans `BACKUP_PASSPHRASE`, il ÉCHOUE : c'est la seule absence qui exposerait.
#
# RELIRE UN DUMP À LA MAIN :
#   gpg --batch --passphrase-file <fichier> -o cosmo.dump -d cosmo-AAAA-MM-JJ.dump.gpg
# ══════════════════════════════════════════════════════════════════
name: db-backup

on:
  schedule:
    # 04:26 UTC tous les jours. Heure décalée des autres crons du dépôt pour ne
    # pas empiler les exécutions sur la même minute.
    - cron: '26 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Verifier le secret
        id: guard
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          # 🔴 Echec FERME : sans phrase secrete, aucun export du tout. Le
          # depot est public, un dump non chiffre serait telechargeable.
          if [ -n "$DB_URL" ] && [ "${#PASSPHRASE}" -lt 32 ]; then
            echo "::error::BACKUP_PASSPHRASE absente ou trop courte : export refuse (le depot est public, un dump en clair serait expose)."
            exit 1
          fi
          if [ -z "$DB_URL" ]; then
            echo "::warning::SUPABASE_DB_URL absent — aucun export produit. Cf. l'en-tete de ce workflow."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # La version de pg_dump doit etre >= celle du serveur, sinon il refuse de
      # tourner. Le paquet de base d'ubuntu-latest retarde souvent d'une
      # majeure : on installe explicitement le client PostgreSQL 17.
      #
      # 🔴 INSTALLER NE SUFFIT PAS, mesure le 2026-08-29 : le paquet 17 se pose
      # A COTE du client 16 preinstalle sur le runner, et c'est le 16 qui gagne
      # dans le PATH. Le run echouait alors sur « aborting because of server
      # version mismatch : server 17.6, pg_dump 16.15 » APRES une connexion
      # reussie — donc tres tard, et en accusant la base. On impose donc le
      # chemin absolu du binaire 17, et on VERIFIE que c'est bien lui qui
      # repond avant d'aller plus loin.
      - name: Installer pg_dump 17
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

          BIN=/usr/lib/postgresql/17/bin
          if [ ! -x "$BIN/pg_dump" ]; then
            echo "::error::postgresql-client-17 installe mais $BIN/pg_dump est absent."
            exit 1
          fi
          # Prioritaire pour toutes les etapes suivantes.
          echo "$BIN" >> "$GITHUB_PATH"

          echo "pg_dump du PATH actuel : $(pg_dump --version)"
          echo "pg_dump impose         : $($BIN/pg_dump --version)"
          "$BIN/pg_dump" --version | grep -q ' 17\.' || {
            echo "::error::Le binaire impose n'est pas en version 17."
            exit 1
          }

      # Diagnostic AVANT la connexion. Le 2026-08-29, un run a echoue sur
      # « password authentication failed for user "postgres" » : l'erreur
      # annoncait un probleme de mot de passe alors que c'etait l'IDENTITE qui
      # etait fausse — le pooler exige `postgres.<ref>`, et sans le suffixe il
      # cherche un utilisateur qui n'existe pas. Une heure perdue a soupconner
      # le mot de passe.
      #
      # 🔴 Ce qui est imprime ne contient JAMAIS le mot de passe, seulement sa
      # LONGUEUR et le fait qu'il soit ou non deja encode en pourcentage. Le
      # reste (utilisateur, hote, port, base) n'est pas secret : la reference du
      # projet est publique, elle est dans le bundle du site.
      - name: Diagnostiquer la chaine (sans le mot de passe)
        if: steps.guard.outputs.ready == 'true'
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          python3 - <<'EOF'
          import os, sys
          from urllib.parse import urlsplit, unquote
          u = urlsplit(os.environ['DB_URL'].strip())
          pwd = u.password or ''
          print(f"schema     : {u.scheme}")
          print(f"utilisateur: {u.username}")
          print(f"hote       : {u.hostname}")
          print(f"port       : {u.port}")
          print(f"base       : {u.path.lstrip('/')}")
          print(f"mot de passe: {len(pwd)} caracteres"
                + (" (contient un encodage %XX)" if '%' in (u.password or '') else ""))
          ok = True
          if not (u.username or '').startswith('postgres.'):
              print("::error::L'utilisateur doit etre `postgres.<ref-du-projet>` sur le pooler. "
                    "Sans le suffixe, le serveur repond « password authentication failed » "
                    "alors que le mot de passe n'est pas en cause.")
              ok = False
          if u.port == 6543:
              print("::error::Port 6543 = pooler en mode TRANSACTION. pg_dump exige le mode "
                    "SESSION (port 5432).")
              ok = False
          if not pwd:
              print("::error::Aucun mot de passe dans la chaine.")
              ok = False
          sys.exit(0 if ok else 1)
          EOF

      - name: Exporter la base
        if: steps.guard.outputs.ready == 'true'
        env:
          # Passe par l'environnement : une URL en argument apparaitrait dans
          # la liste des process de la machine.
          PGCONNECT_TIMEOUT: '30'
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          NOM="cosmo-$(date -u +%Y-%m-%d).dump"
          # --format=custom : compresse, et se restaure table par table.
          # --no-owner : le dump se rejoue sur une instance dont les roles
          #   different, ce qui est precisement le cas d'un changement de
          #   fournisseur.
          # Chemin absolu : `pg_dump` tout court resoudrait vers le client 16.
          echo "Version utilisee : $(/usr/lib/postgresql/17/bin/pg_dump --version)"
          /usr/lib/postgresql/17/bin/pg_dump "$DB_URL" --no-owner --format=custom -f "$NOM"
          ls -lh "$NOM"
          echo "NOM=$NOM" >> "$GITHUB_ENV"

      # Verification minimale : un fichier de 0 octet est un echec silencieux,
      # et c'est exactement le mode de defaillance d'une sauvegarde — on ne
      # s'en apercoit que le jour ou on en a besoin.
      - name: Verifier que le dump n'est pas vide
        if: steps.guard.outputs.ready == 'true'
        run: |
          TAILLE=$(stat -c%s "$NOM")
          echo "Taille : $TAILLE octets"
          if [ "$TAILLE" -lt 100000 ]; then
            echo "::error::Dump suspect ($TAILLE octets). La base fait plusieurs Mo — un fichier aussi petit signale un echec."
            exit 1
          fi
          # `pg_restore --list` relit l'en-tete : un fichier tronque echoue ici.
          /usr/lib/postgresql/17/bin/pg_restore --list "$NOM" | head -5

      # 🔴 Chiffrement AVANT le depot, puis preuve que le fichier se dechiffre
      # a l'identique (sha256). Un chiffrement qu'on ne sait pas relire est une
      # sauvegarde perdue ; on le decouvre ici, pas le jour de la restauration.
      # La phrase passe par un fichier temporaire (mode 600), jamais en
      # argument : elle apparaitrait dans la liste des process.
      - name: Chiffrer le dump
        if: steps.guard.outputs.ready == 'true'
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          umask 077
          PF=$(mktemp)
          printf '%s' "$PASSPHRASE" > "$PF"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PF" \
              --symmetric --cipher-algo AES256 -o "$NOM.gpg" "$NOM"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PF" \
              -o verif.dump -d "$NOM.gpg"
          rm -f "$PF"
          A=$(sha256sum "$NOM" | cut -d' ' -f1)
          B=$(sha256sum verif.dump | cut -d' ' -f1)
          [ "$A" = "$B" ] || { echo "::error::Le dump chiffre ne se relit pas a l'identique."; exit 1; }
          # Le clair ne doit exister nulle part au moment du depot.
          rm -f "$NOM" verif.dump
          [ ! -e "$NOM" ] || { echo "::error::Le dump en clair est encore present."; exit 1; }
          head -c 1 "$NOM.gpg" | od -An -tx1
          echo "CHIFFRE=$NOM.gpg" >> "$GITHUB_ENV"
          ls -lh "$NOM.gpg"

      - name: Deposer l'artefact (chiffre uniquement)
        if: steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: db-dump
          path: ${{ env.CHIFFRE }}
          retention-days: 30
          if-no-files-found: error
