# ═══════════════════════════════════════════════════════════════════
# Webhooks d entreprise (mig. 199, audit entreprise 2026-09-24, etape 6)
#
# Declenche l Edge Function `org-webhook-dispatch`, qui vide la file
# `org_webhook_deliveries` (Slack ou JSON signe). Meme mecanisme que
# `org-digest.yml` : pg_net n est pas installe.
#
# 🔴 A-3 (2026-09-30) : ce job est rouge (HTTP 401) depuis sa creation. La
#    fonction etait absente de supabase/config.toml, donc deployee en
#    verify_jwt = true, et cet appel ne porte pas d Authorization : la
#    passerelle refuse avant le code. Aucun webhook n est jamais parti.
#    Correctif : config.toml (verify_jwt = false) + redeploiement, APRES la
#    mig. 207 (A-6). Le rouge est juste tant que ce n est pas fait.
# ⚠️ Secret absent = ECHEC, jamais un silence vert.
# ═══════════════════════════════════════════════════════════════════
name: org-webhook-dispatch

on:
  schedule:
    # Toutes les dix minutes, decale des autres crons du depot.
    - cron: '7-59/10 * * * *'
  workflow_dispatch:

# Moindre privilege (A-8, CodeQL actions/missing-workflow-permissions) :
# le job n appelle qu une URL, il ne lit ni n ecrit le depot.
permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer les webhooks en attente
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ykeugqfgklejcdbrmawy.supabase.co' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET absent des secrets Actions : AUCUN webhook ne part."
            exit 1
          fi
          code=$(curl -s -o /tmp/out.json -w '%{http_code}' -X POST \
            "$SUPABASE_URL/functions/v1/org-webhook-dispatch" \
            -H "x-cron-secret: $CRON_SECRET")
          echo "HTTP $code"; cat /tmp/out.json; echo
          case "$code" in
            [0-9][0-9][0-9]) ;;
            *) echo "::error::Aucun code HTTP : l appel n a pas eu lieu."; exit 1 ;;
          esac
          [ "$code" = "200" ]
