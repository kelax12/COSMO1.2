# ══════════════════════════════════════════════════════════════════
# V15.4 (FRO-02) · RÉGÉNÉRER LES RÉFÉRENCES VISUELLES, SUR UNE BRANCHE, AVEC REVUE
#
# 🔴 LE DÉFAUT. Le job `visual` régénérait lui-même ses références et les
# COMMITAIT SUR `main` (14 captures d'un geste, après huit jours de rouge
# pendant des refontes). Une référence régénérée sans regard entérine la
# régression qu'elle devait détecter, et rien ne gardait la trace de ce qui
# avait bougé.
#
# Ce workflow est désormais le SEUL chemin d'écriture des références :
#   1. il régénère sur le runner Linux de référence (les polices diffèrent de
#      Windows bien au-delà du seuil : jamais de référence produite sur un
#      poste) ;
#   2. il publie l'artefact `captures-revue` : pour chaque capture modifiée,
#      l'avant (celle de `main`), l'après et la différence, plus `index.html` ;
#   3. il pousse le résultat sur `noyau/captures-<run>`, JAMAIS sur `main`.
#
# Ensuite, c'est un humain qui relit l'artefact, ramène la branche sur `main`
# en ajoutant le trailer `Captures-relues: <URL de ce run>`, puis supprime la
# branche. `scripts/check-captures-relues.mjs` (CI noyau) refuse tout commit de
# `main` qui touche `e2e/__screenshots__/**` sans ce trailer, et vérifie que le
# run cité existe, vient de CE workflow et a réussi. Pas de PR : push direct
# sur `main` (décision du 2026-10-29). Marche à suivre : `e2e/CLAUDE.md`.
#
# ❌ Ne jamais lancer ce workflow « pour faire passer `visual` ». Un rouge dit
#    « ça a changé » : l'artefact dit QUOI, et c'est à lire avant de décider.
# ⚠️ Le trailer prouve qu'un run a produit un artefact, pas que quelqu'un l'a
#    ouvert. C'est une trace, pas une preuve de lecture.
# ══════════════════════════════════════════════════════════════════
name: Captures regenerer

on:
  workflow_dispatch:
    inputs:
      motif:
        description: 'Pourquoi les références changent (une phrase, reprise dans le commit)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: captures-regenerer
  cancel-in-progress: false

jobs:
  regenerer:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      # Pousser la branche `noyau/captures-<run>` et rien d'autre : le dernier
      # pas du job ne cible que `refs/heads/noyau/captures-*`.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Installer Chromium
        run: npx playwright install --with-deps chromium

      # L'AVANT : les références de la révision lancée, copiées avant toute
      # écriture. C'est ce que l'artefact compare.
      - name: Garder les references d avant
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/avant" e2e/__screenshots__
          cp -R e2e/__screenshots__/. "$RUNNER_TEMP/avant/"
          echo "$(find "$RUNNER_TEMP/avant" -name '*.png' | wc -l) reference(s) avant."

      # Deux passes, comme avant : la seconde COMPARE ce que la première a écrit
      # et prouve que les références se reproduisent. Sans elle, on relirait des
      # images qu'un second run ne saurait pas refaire.
      - name: Regenerer, puis verifier que c est reproductible
        run: |
          set -o pipefail
          npx playwright test --project=visual --update-snapshots 2>&1 | tee visual.log
          echo '--- seconde passe : les references sont-elles reproductibles ? ---'
          npx playwright test --project=visual 2>&1 | tee -a visual.log

      - name: Construire l artefact de revue
        run: node scripts/captures-revue.mjs --avant "$RUNNER_TEMP/avant" --apres e2e/__screenshots__ --sortie captures-revue

      - name: Resume du run
        env:
          MOTIF: ${{ inputs.motif }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          {
            echo '### Captures regenerees : a relire avant de ramener sur main'
            echo ''
            echo "Motif : ${MOTIF}"
            echo ''
            node -e "const r=require('./captures-revue/resume.json').compte;console.log('modifiee(s) '+r.modifiee+' · ajoutee(s) '+r.ajoutee+' · supprimee(s) '+r.supprimee+' · identique(s) '+r.identique)"
            echo ''
            echo "1. Ouvrir l'artefact \`captures-revue\` (ce run), puis \`index.html\` : avant, apres, difference."
            echo "2. Si tout est voulu : ramener \`noyau/captures-${GITHUB_RUN_ID}\` sur main avec le trailer :"
            echo ''
            echo '```'
            echo "Captures-relues: ${URL_RUN}"
            echo '```'
            echo ''
            echo '3. Supprimer la branche. Marche complete : `e2e/CLAUDE.md`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Artefact de revue
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-revue
          path: captures-revue/
          if-no-files-found: error
          retention-days: 14

      # La branche, jamais `main`. `git status`, pas `git diff --quiet` : au
      # premier bootstrap les références sont des fichiers NON SUIVIS (C-115).
      - name: Pousser la branche noyau/captures-run
        env:
          MOTIF: ${{ inputs.motif }}
          URL_RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- e2e/__screenshots__)" ]; then
            echo "::notice title=captures::Aucune reference ne change : pas de branche."
            exit 0
          fi
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -- e2e/__screenshots__
          COMBIEN=$(git diff --cached --name-only | wc -l)
          # Pas de trailer ici : il s'ajoute a la main apres relecture.
          git commit -m "chore(visual): ${COMBIEN} reference(s) de capture (V15.4)" -m "Motif : ${MOTIF}" -m "Artefact de revue : ${URL_RUN}"
          git push origin "HEAD:refs/heads/noyau/captures-${{ github.run_id }}"
