# ══════════════════════════════════════════════════════════════════
# Sonde de disponibilite de la production (AM-4 de docs/ROADMAP-60J.md).
#
# POURQUOI : personne n'etait prevenu si `thecosmo.app` ou l'API Supabase
# tombait. `OPS_ALERT_WEBHOOK_URL` n'est pas pose, donc `alert.ts` est un no-op
# silencieux, et il ne couvrirait de toute facon que les Edge Functions, pas le
# site. A 28 comptes une panne passait inapercue ; a 100, elle se decouvre par
# un utilisateur, c'est-a-dire trop tard.
#
# CE QUE CA VAUT, ET CE QUE CA NE VAUT PAS. Le cron de GitHub Actions n'est pas
# ponctuel : il est mis en file d'attente et peut deriver de plusieurs dizaines
# de minutes, voire sauter une execution aux heures chargees. La granularite
# reelle est donc « prevenu dans l'heure », pas « prevenu en trois minutes ».
# 🔴 Ce n'est PAS un substitut a une sonde externe (T-17, UptimeRobot ou Better
# Stack, palier gratuit) : une sonde hebergee chez un tiers survit a une panne
# de GitHub, celle-ci non. C'est le passage de « personne n'est prevenu » a
# « quelqu'un est prevenu », en attendant.
#
# CE QUE CA FAIT EN CAS DE PANNE : ouvre une issue GitHub, donc un mail, on est
# abonne d'office a son propre depot. Meme mecanique que `ci-alert.yml`, meme
# raison : un resultat affiche sur une page que personne n'ouvre n'est pas une
# alerte. L'issue se referme TOUTE SEULE au retour du vert, ce qui rearme
# l'alerte sans geste manuel.
#
# Aucun service externe, aucun compte a creer, et AUCUN SECRET REQUIS.
#
# 🔴 Correction du 2026-09-02. Cet en-tete affirmait que le secret
# `SUPABASE_URL` « existe deja pour renewal-notice ». Il n'existait pas, et
# personne ne l'avait vu : le run sortait VERT en n'ayant sonde que le site,
# la branche backend tombant dans son `::warning::`. Une sonde a moitie
# aveugle qui affiche du vert est pire qu'une sonde absente.
#
# L'URL du projet n'est pas un secret : elle est deja dans le bundle client,
# dans `docs/DEPLOYMENT.md`, et en dur dans `restore-drill.yml` de ce meme
# depot public. Elle est donc posee en repli ci-dessous, et le secret ne sert
# plus qu'a pointer la sonde ailleurs (bascule de projet).
# ══════════════════════════════════════════════════════════════════
name: Uptime

on:
  schedule:
    # Deux fois par heure, aux minutes 17 et 47. Decalees des autres crons du
    # depot pour ne pas empiler les executions sur la meme minute.
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

# Une panne dure plus longtemps qu'un run : deux sondes simultanees ouvriraient
# deux fois la meme issue.
concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Sonder la production
        id: probe
        env:
          # Repli sur l'URL de production, publique (cf. en-tete). Le secret
          # reste prioritaire pour pouvoir sonder un autre projet sans toucher
          # a ce fichier.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://ykeugqfgklejcdbrmawy.supabase.co' }}
        run: |
          set -uo pipefail
          PANNES=""

          # ── 1. Le site ──────────────────────────────────────────────
          # Un code 200 ne suffit PAS : Vercel sert la SPA sur toutes les URLs,
          # et une page d'erreur repond 200 comme le reste.
          #
          # 🔴 C-104, corrige le 2026-09-20. Le marqueur precedent etait
          # `grep -i cosmo`, et il ne pouvait PAS echouer sur le defaut qu'il
          # pretendait detecter : la coquille SPA de `index.html` contient le
          # mot « cosmo » VINGT-ET-UNE fois (titre, meta, manifest, JSON-LD
          # Organization). Une prod servant la coquille vide, prerendu casse et
          # app morte, passait donc au vert. C'est exactement le piege deja paye
          # par la garde Lighthouse qui mesurait une 404 (T-50).
          #
          # Les marqueurs ci-dessous sont choisis pour ETRE ABSENTS de la
          # coquille, verifie le 2026-09-20 sur `index.html` a la racine du
          # depot :
          #   · `id="seo-fallback"` — le bloc de contenu indexable, injecte par
          #     `prerender.mjs` et par lui seul. Absent si le prerendu n'a pas
          #     tourne ou si Vercel sert le fallback SPA.
          #   · `"FAQPage"` — le JSON-LD propre a la HOME, injecte lui aussi au
          #     prerendu. Il distingue « la home » de « une page prerendue
          #     quelconque servie a sa place ».
          #   · `/assets/` — au moins une reference d'actif hashe, donc un
          #     bundle reellement publie et non un HTML orphelin.
          # ❌ Ne jamais remplacer ces marqueurs par un mot du contenu
          #    editorial : le contenu se reecrit, et une garde qui rougit a
          #    chaque relecture de la landing finit desarmee.
          CODE_APP=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 \
            -o /tmp/app.html -w '%{http_code}' https://thecosmo.app/ || echo 000)
          # `--retry` fait ecrire le code une fois PAR tentative : trois echecs
          # donnent « 000000000 ». On ne garde que la derniere, la seule qui
          # decrit l'etat final.
          CODE_APP=${CODE_APP: -3}
          echo "app : HTTP $CODE_APP ($(wc -c < /tmp/app.html) octets)"
          if [ "$CODE_APP" != "200" ]; then
            PANNES="$PANNES\n- **Site** \`https://thecosmo.app/\` : HTTP \`$CODE_APP\`"
          else
            ABSENTS=""
            grep -q 'id="seo-fallback"' /tmp/app.html || ABSENTS="$ABSENTS seo-fallback"
            grep -q '"FAQPage"'         /tmp/app.html || ABSENTS="$ABSENTS FAQPage"
            grep -q '/assets/'          /tmp/app.html || ABSENTS="$ABSENTS assets"
            if [ -n "$ABSENTS" ]; then
              PANNES="$PANNES\n- **Site** : HTTP 200 mais la home ne contient plus :\`$ABSENTS\`. La coquille SPA est servie a la place du prerendu (voir C-104)."
            fi
          fi

          # ── 1 bis. Une SECONDE page prerendue ────────────────────────
          # La home a un chemin a elle dans `prerender.mjs` (FAQPage, contenu
          # statique). Une seule page ne dit rien du reste du site : si le
          # prerendu a tourne a moitie, seules les autres routes manquent. Le
          # guide est la page la plus stable du site et la deuxieme du sitemap.
          CODE_GUIDE=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 \
            -o /tmp/guide.html -w '%{http_code}' https://thecosmo.app/guide || echo 000)
          CODE_GUIDE=${CODE_GUIDE: -3}
          echo "guide : HTTP $CODE_GUIDE"
          if [ "$CODE_GUIDE" != "200" ]; then
            PANNES="$PANNES\n- **Page /guide** : HTTP \`$CODE_GUIDE\`"
          elif ! grep -q 'id="seo-fallback"' /tmp/guide.html; then
            PANNES="$PANNES\n- **Page /guide** : HTTP 200 sans bloc prerendu — le prerendu n'a couvert que la home."
          fi

          # ── 2. L'API d'authentification ─────────────────────────────
          # Sans `apikey`, GoTrue repond 401 : c'est une PREUVE DE VIE, pas une
          # panne. Le secret n'est donc volontairement pas requis ici, et on
          # n'expose aucune cle dans un depot public. Ce qui signale une panne,
          # c'est un 5xx, un 000 (injoignable) ou la page « projet en pause ».
          # 🔴 Plus d'avertissement silencieux ici. La version precedente
          # sautait cette moitie de la sonde et sortait VERTE, donc « tout va
          # bien » signifiait en realite « le site repond, on n'a rien su du
          # backend ». Avec le repli d'URL ce cas ne peut plus survenir sauf a
          # poser le secret VIDE, ce qui est une erreur de configuration : elle
          # doit echouer, pas se taire.
          if [ -z "${SUPABASE_URL:-}" ]; then
            echo "::error::SUPABASE_URL vide : la sonde backend ne peut pas s'executer. Retirer le secret vide pour reprendre le repli."
            exit 1
          else
            CODE_AUTH=$(curl -sS --max-time 20 --retry 2 --retry-delay 5 \
              -o /tmp/auth.json -w '%{http_code}' "$SUPABASE_URL/auth/v1/health" || echo 000)
            CODE_AUTH=${CODE_AUTH: -3}
            echo "auth : HTTP $CODE_AUTH"
            case "$CODE_AUTH" in
              200|401) ;;
              *) PANNES="$PANNES\n- **API Auth** \`$SUPABASE_URL/auth/v1/health\` : HTTP \`$CODE_AUTH\` (attendu 200 ou 401)" ;;
            esac
            # 🔴 C-104, meme raison que pour le site : un projet Supabase EN
            # PAUSE repond 200 en servant une page HTML d'information. Le code
            # seul ne distingue donc pas « GoTrue tourne » de « le projet
            # dort », et la pause pour inactivite est le mode de defaillance
            # attendu sur un plan `free` (cf. C-87).
            # Un 401 est une preuve de vie : GoTrue a lu la requete et l'a
            # refusee faute d'`apikey`. On n'exige le marqueur JSON que sur un
            # 200, ou le corps est cense etre `{"name":"GoTrue",...}`.
            if [ "$CODE_AUTH" = "200" ] && ! grep -qiE 'gotrue|"version"' /tmp/auth.json; then
              PANNES="$PANNES\n- **API Auth** : HTTP 200 mais la reponse n'est pas celle de GoTrue (projet en PAUSE, ou page d'information servie a la place)."
            fi
          fi

          if [ -n "$PANNES" ]; then
            {
              echo 'pannes<<FIN'
              printf '%b\n' "$PANNES"
              echo 'FIN'
            } >> "$GITHUB_OUTPUT"
            echo "down=true" >> "$GITHUB_OUTPUT"
            echo "::error::Production injoignable ou degradee."
          else
            echo "down=false" >> "$GITHUB_OUTPUT"
            echo "Production en ligne."
          fi

      - name: Ouvrir ou mettre a jour l'issue « prod injoignable »
        if: steps.probe.outputs.down == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PANNES: ${{ steps.probe.outputs.pannes }}
        run: |
          set -euo pipefail
          gh label create uptime-red --repo "$REPO" --color b60205 \
            --description "Production injoignable" 2>/dev/null || true

          QUAND=$(date -u '+%Y-%m-%d %H:%M UTC')
          # printf plutot qu'un heredoc : dans un `run:` indente, le marqueur de
          # fin devrait etre en debut de ligne, ce que l'indentation YAML
          # interdit.
          BODY=$(printf '%s\n' \
            "Sonde du $QUAND :" \
            "$PANNES" \
            "" \
            "- Run : $RUN_URL" \
            "" \
            "Verifier dans l'ordre : statut Vercel, statut du projet Supabase" \
            "(un projet en pause repond, mais pas ce qu'on attend), puis les" \
            "logs de la fonction concernee." \
            "" \
            "Cette issue se met a jour a chaque sonde en echec et **se referme" \
            "seule** au retour du vert. Ne pas la fermer a la main : sa" \
            "fermeture est le signal de retablissement.")

          EXISTING=$(gh issue list --repo "$REPO" --state open --label uptime-red \
                       --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh issue create --repo "$REPO" --title "Production injoignable" \
              --label uptime-red --body "$BODY"
          fi

      # Refermer automatiquement, sinon la premiere panne rendrait la sonde
      # muette pour toutes les suivantes : l'issue resterait ouverte et les
      # echecs suivants ne seraient plus que des commentaires sur un incident
      # que tout le monde croit clos.
      - name: Refermer l'issue si la prod est revenue
        if: steps.probe.outputs.down == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          EXISTING=$(gh issue list --repo "$REPO" --state open --label uptime-red \
                       --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" --repo "$REPO" \
              --comment "Retabli : la sonde du $(date -u '+%Y-%m-%d %H:%M UTC') repond normalement."
          fi
