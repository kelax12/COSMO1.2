# ══════════════════════════════════════════════════════════════════
# C-81 · AM-1 — REJOUER LES SABOTAGES : qui garde les gardes ?
# ══════════════════════════════════════════════════════════════════
#
# 🔴 LE DÉFAUT QUE CE WORKFLOW FERME. Un témoin est un cas de test qui prouve
# qu'une garde mord encore. Chacun est arrivé avec la même phrase : « vu rouge
# sur N sabotages ». Ce sabotage a été joué UNE FOIS, à la main, le jour de
# l'écriture. Rien, ensuite, ne disait qu'un témoin détecte ENCORE.
#
# Un témoin qui ne détecte plus est pire qu'un témoin absent : il produit un
# vert, et ce vert est lu comme une preuve.
#
# ⚠️ ET ÇA N'EST PAS THÉORIQUE. À la première exécution, le 2026-09-20, le
# rejeu a trouvé `src/monitoring.guard.test.ts` VERT sur son sabotage. Au
# premier rejeu étendu, le 2026-10-15, `check-bundle-budget.guard.test.mjs`
# restait VERT sur le défaut exact qu'il documente (`{8,}` dans le découpage
# du hash). Les deux témoins ont été réparés le jour même.
#
# ── CE QUE LE SCRIPT FAIT ───────────────────────────────────────────
#
# Il recompte les témoins (cas nommés TÉMOIN, par l'AST), COPIE l'arbre dans
# un dossier temporaire, et pour chaque sabotage du catalogue
# (`scripts/replay-sabotages.catalogue.mjs`) : casse la chose gardée DANS LA
# COPIE, rejoue la garde, exige qu'elle rougisse pour la raison nommée,
# restaure la copie. Il imprime le ratio témoins rejoués / témoins du dépôt.
# Trois copies jouent en parallèle sur le runner.
#
# ── POURQUOI PAS DANS `ci.yml` ──────────────────────────────────────
#
# Plus de deux cents rejeux, chacun un vitest : une dizaine de minutes, pour
# une question qu'on se pose une fois par semaine et à chaque PR qui touche
# un témoin ou une garde, pas à chaque push.
#
# 🔴 Le script n'écrit JAMAIS dans l'arbre de travail. Le contrôle « arbre
# intact » ci-dessous le vérifie quand même : un `git status` sale en fin de
# job dirait qu'il s'est trompé, et sur un runner personne ne le verrait.
#
# Les échecs remontent par `ci-alert.yml`.
# ══════════════════════════════════════════════════════════════════
name: Sabotages

on:
  schedule:
    # Hebdomadaire, le lundi à 06:13 UTC. Minute décalée des autres crons.
    - cron: '13 6 * * 1'
  workflow_dispatch:
  # 🔴 AUSSI SUR LES PULL REQUESTS QUI TOUCHENT UN TÉMOIN, UNE GARDE OU UNE
  # CIBLE DU CATALOGUE. C'est le moment où un témoin se désarme : on le
  # modifie, on le voit vert, on conclut. Attendre le lundi suivant, c'est
  # laisser une garde morte sur `main` pendant six jours.
  pull_request:
    paths:
      - '**/*.test.*'
      - 'scripts/**'
      - 'eslint-rules/**'
      - 'vercel.json'
      - '.env.example'
      - 'vitest.tooling.config.ts'
      - 'src/main.tsx'
      - 'src/App.tsx'
      - 'src/lib/csv-export.ts'
      - 'src/locales/**'
      - 'supabase/functions/**'
      - 'supabase/migration/**'

permissions:
  contents: read

concurrency:
  group: sabotages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rejouer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      - name: Rejouer les sabotages connus
        # 🔴 C-113 · le journal s'écrit dans `$RUNNER_TEMP`, JAMAIS dans l'arbre.
        # Écrit à la racine, il rendait `git status` sale et faisait échouer
        # l'étape suivante à chaque run, alors que les 11 sabotages étaient vus :
        # le seul run (2026-09-21) était rouge pour cette raison-là.
        run: |
          set -o pipefail
          LOG="$RUNNER_TEMP/sabotages.log"
          if npm run check:sabotages 2>&1 | tee "$LOG"; then
            {
              echo '### Rejeu des sabotages'
              echo ''
              echo '```'
              sed -n '/── Ratio/,$p' "$LOG"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '### ✖ Un temoin ne detecte plus'
            echo ''
            echo '```'
            tail -n 80 "$LOG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 25 "$LOG" | while IFS= read -r LIGNE; do
            echo "::error title=sabotage::${LIGNE}"
          done
          exit 1

      # 🔴 LE CONTRÔLE QUI COMPTE AUTANT QUE LE REJEU. Le script ne doit rien
      # écrire dans l'arbre, et le vérifie lui-même ; un `git status` sale en
      # fin de job dirait qu'il s'est trompé — et sur un runner, personne ne
      # le verrait.
      - name: L arbre est-il revenu intact ?
        if: ${{ always() }}
        run: |
          set -euo pipefail
          SALE=$(git status --porcelain)
          if [ -n "$SALE" ]; then
            echo "::error title=sabotage::L arbre n a PAS ete restaure :"
            echo "$SALE"
            exit 1
          fi
          echo "Arbre de travail intact."
