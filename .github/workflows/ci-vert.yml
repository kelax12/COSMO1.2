# ──────────────────────────────────────────────────────────────────────
# CI vert · le verdict du noyau, publie en TAG pour la porte de deploiement
# (CI-02, vague 3.2, 2026-11-07).
#
# 🔴 POURQUOI
#
# Vercel construisait et publiait chaque poussee sur `main` en ~40 s, avant
# que `CI noyau` ne rende son verdict (~5 min) : un commit rouge partait en
# production. La porte est `scripts/vercel-ignore-build.mjs`, lancee par
# Vercel (`vercel.json` → `ignoreCommand`) : un build de production attend
# le tag `ci-vert/<sha>` que pose CE workflow.
#
# ── CE QU'IL FAIT ─────────────────────────────────────────────────────
#
#   · `CI noyau` VERT sur une poussee (`main` ou `noyau/**`) : tag leger
#     `ci-vert/<sha>`. `noyau/**` compte : c'est le meme verdict que celui
#     que le hook `pre-push` accepte pour laisser passer ce SHA sur `main`,
#     et le chemin habituel (branche `noyau/<nom>` d'abord, `main` ensuite)
#     deploie alors sans attendre un second noyau.
#   · `CI noyau` ROUGE sur `main` : tag `ci-rouge/<sha>`, pour que la porte
#     cesse d'attendre et libere le slot de build au lieu de sonder 15 min.
#     ❌ Jamais sur `noyau/**` : un temoin rouge pousse expres sur une
#     branche, puis le meme SHA vert sur `main`, serait refuse a tort.
#   · un vert apres un rouge (Re-run) retire `ci-rouge/<sha>`.
#   · garde les 50 tags les plus recents de chaque sorte (date du commit).
#
# ── POURQUOI UN WORKFLOW A PART, ET PAS UN JOB DE `CI NOYAU` ──────────
#
# Un job de plus dans `ci-noyau.yml` ferait dependre le verdict du commit
# d'un etat EXTERIEUR (API GitHub, droits du jeton), ce que ce workflow
# s'interdit : un echec de pose rendrait `main` rouge, donc la poussee
# suivante impossible. Ici, un echec rend CE run rouge, `ci-alert.yml`
# sonne, et la production reste sur son dernier deploiement vert (echec
# ferme cote porte).
#
# ── LA PORTE DES MIGRATIONS (CI-05, 2026-11-20) ───────────────────────
#
# Un vert n'est tague QUE si chaque migration de `supabase/migration/` au SHA
# est en production : meme lecture du ledger et meme classeur que
# `migration-coverage.yml` et `edge-deploy.yml` (`check-migration-coverage.mjs
# --sens=depot`). Les migrations 262 a 265 etaient parties en production avec
# leur code avant d'etre appliquees. Refus = aucun tag, ce run rouge, la
# production reste sur son dernier deploiement (la porte de Vercel sonde 15
# min, puis ignore le build). Geste : appliquer la migration, puis Re-run de
# CE run (le tag est alors pose), puis redeployer si le build a ete ignore.
# Echec FERME : `SUPABASE_DB_URL` absent, ledger illisible ou vide = refus.
# ❌ Jamais de `if: secrets.X != ''` sur cette porte.
#
# Secrets : `SUPABASE_DB_URL` pour le seul job `migrations` (lecture du
# catalogue, rien publie) ; le job `tag` ne voit que `GITHUB_TOKEN`, `contents: write`. Un tag
# pose par `GITHUB_TOKEN` ne declenche aucun workflow, et Vercel ne
# deploie pas les tags.
# Temoin : `scripts/porte-deploiement.guard.test.mjs`.
# ──────────────────────────────────────────────────────────────────────
name: CI vert
run-name: >-
  ${{ format('CI vert {0} ({1}, {2})', github.event.workflow_run.head_sha,
      github.event.workflow_run.conclusion, github.event.workflow_run.head_branch) }}

on:
  workflow_run:
    workflows: [CI noyau]
    types: [completed]
    branches: [main, 'noyau/**']

permissions:
  contents: read

# Un run a la fois : le menage des tags lit puis supprime, deux runs
# concurrents se marcheraient dessus. Aucun n'est annule.
concurrency:
  group: ci-vert
  cancel-in-progress: false

jobs:
  # SANS secret : seul job qui touche au SHA du run, sans checkout. Il en lit les fichiers
  # `supabase/migration/` par l'API (donnees inertes, jamais executees) et les passe en
  # artefact ; le job `migrations`, qui lit la prod, n'a plus aucun acces au SHA.
  depot:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # AUCUN checkout du SHA : la liste et les contenus passent par l'API
      # (jeton en lecture), ecrits sous un chemin fixe, noms valides.
      - name: Lire les migrations du SHA par l'API (lecture seule, aucun secret)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then echo "::error title=CI vert::SHA illisible : '$SHA'"; exit 1; fi
          DEPOT="$RUNNER_TEMP/depot/supabase/migration"; mkdir -p "$DEPOT"
          gh api "repos/$REPO/contents/supabase/migration?ref=$SHA" --jq '.[] | select(.type == "file") | "\(.sha) \(.name)"' > "$RUNNER_TEMP/liste.txt" || { echo "::error title=CI vert::migrations de $SHA illisibles."; exit 1; }
          N=0
          while read -r BLOB NOM; do
            [[ "$BLOB" =~ ^[0-9a-f]{40}$ ]] || { echo "::error title=CI vert::identifiant de blob illisible."; exit 1; }
            [[ "$NOM" =~ \.sql$ ]] || continue
            [[ "$NOM" =~ ^[0-9]+[a-z]?_[A-Za-z0-9_.-]+\.sql$ ]] || { echo "::error title=CI vert::nom de migration inattendu."; exit 1; }
            gh api -H "Accept: application/vnd.github.raw+json" "repos/$REPO/git/blobs/$BLOB" > "$DEPOT/$NOM" || { echo "::error title=CI vert::contenu de $NOM illisible."; exit 1; }
            N=$((N + 1))
          done < "$RUNNER_TEMP/liste.txt"
          test "$N" -gt 0 || { echo "::error title=CI vert::aucune migration dans $SHA."; exit 1; }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: migrations-depot
          path: ${{ runner.temp }}/depot/supabase/migration
          if-no-files-found: error
          retention-days: 1

  # Job a part : il LIT la prod (secret) et ne publie rien ; le job `tag`
  # publie (tag, menage) et ne voit aucun secret.
  migrations:
    needs: depot
    if: >-
      !cancelled() &&
      needs.depot.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: migrations-depot
          path: ${{ runner.temp }}/depot/supabase/migration

      - name: Installer psql 17
        run: |
          set -euo pipefail
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/pgdg.gpg
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          echo /usr/lib/postgresql/17/bin >> "$GITHUB_PATH"

      - name: Porte · toutes les migrations du depot sont en production
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          # Porte des migrations : fichiers de CE SHA (artefact du job `depot`,
          # le checkout est celui de `main`), ledger de la production.
          REFUS() {
            echo "::error title=CI vert::$1"
            {
              echo "### ❌ Vert NON publie : $1"
              echo ""
              echo "Appliquer en prod les migrations listees, puis relancer CI vert sur ce SHA (Re-run all jobs), puis redeployer si le build Vercel a ete ignore."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          [ -n "${DB_URL:-}" ] || REFUS "SUPABASE_DB_URL absent : migrations non verifiees, aucun tag."
          DEPOT="$RUNNER_TEMP/depot"
          test -n "$(ls "$DEPOT/supabase/migration" 2>/dev/null)" || REFUS "migrations du SHA illisibles : artefact vide."
          node scripts/check-migration-coverage.mjs --print-sql > "$RUNNER_TEMP/introspection.sql"
          psql "$DB_URL" -A -t -f "$RUNNER_TEMP/introspection.sql" > "$RUNNER_TEMP/introspection.json" || REFUS "ledger de production illisible."
          test -s "$RUNNER_TEMP/introspection.json" || REFUS "ledger de production vide."
          if ! COSMO_MIGRATION_DIR="$DEPOT/supabase/migration" node scripts/check-migration-coverage.mjs "$RUNNER_TEMP/introspection.json" --sens=depot > "$RUNNER_TEMP/m.out" 2> "$RUNNER_TEMP/m.err"; then
            cat "$RUNNER_TEMP/m.out" "$RUNNER_TEMP/m.err"
            { echo '```'; grep -E '^ +[0-9]+[a-z]?_.*\.sql' "$RUNNER_TEMP/m.err" || cat "$RUNNER_TEMP/m.err"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            REFUS "migration(s) du depot absente(s) de la production."
          fi
          echo "Migrations : toutes en production."

  tag:
    # Echec FERME : un refus de `migrations` (failure) ne laisse PAS passer ;
    # (idem `depot`, dont un echec saute `migrations`) ; seul son saut (conclusion non verte) laisse le rouge de main se publier.
    needs: [depot, migrations]
    if: >-
      !cancelled() &&
      (needs.depot.result == 'success' || needs.depot.result == 'skipped') &&
      (needs.migrations.result == 'success' || needs.migrations.result == 'skipped') &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.conclusion == 'success' ||
       (github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Historique complet SANS les blobs : le menage trie les tags par date
      # de commit, qui exige les commits, jamais le contenu des fichiers.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # Pose par l'API, pas par `git push` : le commit d'une branche
      # `noyau/**` deja supprimee n'est plus dans le clone, mais GitHub le
      # garde, et l'API le retrouve.
      - name: Poser le tag du verdict
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          if ! [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=CI vert::SHA illisible : '$SHA'"
            exit 1
          fi
          if [ "$CONCLUSION" = success ]; then SORTE=ci-vert; else SORTE=ci-rouge; fi
          REF="refs/tags/$SORTE/$SHA"
          if gh api -X POST "repos/$REPO/git/refs" -f ref="$REF" -f sha="$SHA" > /dev/null 2> pose.err; then
            echo "Pose : $REF"
          else
            # Deja pose (second noyau sur le meme SHA, Re-run) : seule une
            # ref qui pointe sur CE commit est acceptee.
            LU=$(gh api "repos/$REPO/git/ref/tags/$SORTE/$SHA" --jq .object.sha 2> /dev/null || true)
            if [ "$LU" != "$SHA" ]; then
              cat pose.err
              echo "::error title=CI vert::pose de $REF refusee, et la ref lue rend '${LU:-rien}'"
              exit 1
            fi
            echo "Deja pose : $REF"
          fi
          if [ "$SORTE" = ci-vert ] && [ -n "$(git ls-remote origin "refs/tags/ci-rouge/$SHA")" ]; then
            gh api -X DELETE "repos/$REPO/git/refs/tags/ci-rouge/$SHA"
            echo "Retire : refs/tags/ci-rouge/$SHA (vert apres un rouge)"
          fi
          {
            echo "### Verdict publie"
            echo ""
            echo "\`$REF\` ($CONCLUSION, $RUN_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Garder les 50 tags les plus recents de chaque sorte
        run: |
          set -euo pipefail
          git fetch --quiet --prune origin \
            '+refs/tags/ci-vert/*:refs/tags/ci-vert/*' \
            '+refs/tags/ci-rouge/*:refs/tags/ci-rouge/*'
          for SORTE in ci-vert ci-rouge; do
            mapfile -t VIEUX < <(git for-each-ref --sort=-committerdate \
              --format='%(refname)' "refs/tags/$SORTE/" | tail -n +51)
            if [ "${#VIEUX[@]}" -gt 0 ]; then
              git push --quiet origin --delete "${VIEUX[@]}"
              echo "Retires ($SORTE) : ${#VIEUX[@]}"
            fi
          done
