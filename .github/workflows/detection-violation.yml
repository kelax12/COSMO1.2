# ──────────────────────────────────────────────────────────────────────
# Detection violation · le delai CNIL de 72 h court depuis la DETECTION
#
# POURQUOI : `BK-1` (dumps de la base en clair dans les artefacts de ce depot
# public, du 2026-08-29 au 2026-10-13) a ete trouvee par un audit, 45 jours
# apres le debut de l'exposition, et par aucune garde. Rien ne lisait les
# journaux d'acces, ni le contenu des artefacts, ni les alertes de secret
# scanning (`docs/RGPD-VIOLATION.md` AM-2, AM-2bis, AM-3 ;
# `docs/OBSERVABILITE.md` AM-5).
#
# CE QUE CA FAIT, chaque matin : `scripts/detection-violation.mjs` lit les
# alertes GitHub (secret scanning, code scanning), le CONTENU des artefacts
# deposes depuis 26 h, et les journaux Supabase (echecs d'authentification,
# reinitialisations, lignes lues par un compte, lignes rendues a `anon`)
# contre une reference d'ecart. Chaque run ecrit une ligne datee dans un
# journal CHIFFRE (gpg, `BACKUP_PASSPHRASE`), depose en artefact : il dit
# quelles sources ont ete lues, donc un registre vide se lit contre lui.
#
# 🔴 ECHEC FERME : un jeton absent, une source illisible, un signal = run
# ROUGE, donc `ci-alert.yml` (issue + webhook). Un signal pousse EN PLUS son
# propre message, qui porte l'echeance de 72 h : ce n'est pas la meme
# information que « un workflow est rouge », et c'est celle qui manquait le
# 2026-10-16 (la procedure n'avait pas de minuterie).
# ⚠️ Le journal du run est PUBLIC : il ne porte que des statuts et des
# comptes. Une IP, un compte, un numero d'alerte ne vivent que dans le
# journal chiffre. Garde : `scripts/artefacts-donnees-prod.guard.test.mjs`.
#
# SECRET A POSER (Axel) : `SECURITY_ALERTS_TOKEN`, jeton fin en lecture seule
# sur ce depot, permission « Secret scanning alerts: Read ». Le jeton du run
# ne peut pas lire ces alertes.
# ──────────────────────────────────────────────────────────────────────
name: Detection violation

on:
  schedule:
    - cron: '30 5 * * *'
  workflow_dispatch:
  # Le detecteur se prouve sur la PR qui le change : une lecture reelle,
  # deposee chiffree. Un run de branche n'entre pas dans la reference.
  pull_request:
    paths:
      - .github/workflows/detection-violation.yml
      - scripts/detection-violation.mjs

permissions:
  contents: read
  actions: read
  security-events: read

concurrency:
  group: detection-violation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detecter:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node est preinstalle sur le runner ; le script n'a aucune dependance
      # hors bibliotheque standard (et `ops-alert.mjs`, du depot).
      - name: Lire les signaux de detection
        env:
          GH_TOKEN: ${{ github.token }}
          SECURITY_ALERTS_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
          WEBHOOK: ${{ secrets.OPS_ALERT_WEBHOOK_URL }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BRANCHE: ${{ github.head_ref || github.ref_name }}
        run: node scripts/detection-violation.mjs

      # 🔴 Chiffre AVANT le depot, puis prouve que le chiffre se relit a
      # l'identique (meme geste que `db-backup.yml`). `always()` : un run qui
      # a trouve un signal est precisement celui dont la trace compte.
      - name: Chiffrer le journal
        if: always()
        env:
          PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          [ -f journal.jsonl ] || { echo "::error::Aucun journal ecrit : rien n'a ete lu."; exit 1; }
          umask 077
          PF=$(mktemp)
          printf '%s' "$PASSPHRASE" > "$PF"
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PF" \
              --symmetric --cipher-algo AES256 -o journal.jsonl.gpg journal.jsonl
          gpg --batch --yes --pinentry-mode loopback --passphrase-file "$PF" \
              -o verif.jsonl -d journal.jsonl.gpg
          rm -f "$PF"
          A=$(sha256sum journal.jsonl | cut -d' ' -f1)
          B=$(sha256sum verif.jsonl | cut -d' ' -f1)
          [ "$A" = "$B" ] || { echo "::error::Le journal chiffre ne se relit pas a l'identique."; exit 1; }
          rm -f journal.jsonl verif.jsonl
          [ ! -e journal.jsonl ] || { echo "::error::Le journal en clair est encore present."; exit 1; }
          head -c 1 journal.jsonl.gpg | od -An -tx1
          ls -lh journal.jsonl.gpg

      - name: Deposer le journal (chiffre uniquement)
        if: always() && hashFiles('journal.jsonl.gpg') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: detection-journal
          path: journal.jsonl.gpg
          retention-days: 90
          if-no-files-found: error
