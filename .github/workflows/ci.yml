# ──────────────────────────────────────────────────────────────────────
# CI etendue · ce qui tourne a chaque commit SANS bloquer (vague 2.2, 2026-11-06)
#
# 🔴 AUCUN JOB DE CE WORKFLOW NE BLOQUE : ni la poussee (`.githooks/pre-push`
# ne lit que `CI noyau`), ni `edge-deploy.yml`, et `ci-alert.yml` ne le
# suit plus. Le verdict bloquant du commit est `ci-noyau.yml`.
#
# Restent ici :
#   · `e2e`        : Playwright, 4 projects, ~30 min.
#   · `lighthouse` : scores mesures sur un runner partage, variables.
# `audit` (`npm audit`) retire le 2026-11-08 (V18.1) : les alertes et les
# mises a jour de securite Dependabot sont actives sur le depot et couvrent
# toutes les dependances du lockfile, dev comprises.
# Lus a la demande (`gh run list --workflow "CI etendue"`), pas pousses.
# ──────────────────────────────────────────────────────────────────────
name: CI etendue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege default token. Jobs that need more elevate explicitly.
permissions:
  contents: read

# ⚠️ Les `uses:` sont pinnés sur un SHA de commit 40 caractères, JAMAIS sur un
# tag ni une branche. Un tag est repointable par le propriétaire de l'action
# sans que rien ne bouge chez nous — c'est le vecteur des compromissions
# tj-actions/changed-files et trivy-action. `supabase/setup-cli@v1` était même
# une BRANCHE (refs/heads/v1), qui avance à chaque release.
# Le dégât ici n'est pas le vol de secret (seuls l'URL et l'anon key Supabase,
# publiques par conception, sont exposées, et aucun job ne déploie) : c'est une
# CI qui ment. Une action compromise peut neutraliser check:rls, i18n:check ou
# validate:migrations et faire passer un build rouge pour vert — or ces gates
# sont la seule chose qui empêche une régression RLS de partir en prod.
# Le commentaire `# vX.Y.Z` en fin de ligne est la version lisible ; c'est aussi
# ce que Dependabot (ecosystem github-actions) met à jour en bumpant le SHA.

# 🔴 SUR `main`, AUCUN RUN N'EN ANNULE UN AUTRE (2026-10-16). Le groupe y est
# le COMMIT : chaque push a le sien, donc son verdict complet. Avant, le push
# suivant annulait le run en cours : sur les 141 runs `CI` de `main` créés du
# 10-09 au 10-16, 108 annulés, `e2e` (23 min) le premier, et quatre sessions
# ont dû ouvrir une PR brouillon jetable (n° 71, 72, 74, 76) pour un verdict.
# Sur une PR, le push suivant annule toujours le précédent : seul son dernier
# commit compte.
# Coût : 0 minute facturée (dépôt public, runners standard ; `timing` du run
# 38907264016 : `total_ms: 0`). Le vrai prix est le parallélisme : rejoué sur
# ces 141 runs, le pic aurait été de 6 runs et 16 jobs simultanés, sous les 20
# du plan gratuit. ⚠️ Si `e2e` redevient lent (4,3 h le 10-02, quand il était
# rouge), le pic monte à 28 jobs : ils attendent en file, aucun n'est annulé.
# ⚠️ Un rouge peut donc finir APRÈS le vert qui l'a réparé : `ci-alert.yml` ne
# le pousse plus (`scripts/ci-alert-perime.mjs`).
# Témoin : `ci-toutes-les-gardes.guard.test.mjs` (« concurrency »).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ──────────────────────────────────────────────────────────────────
  # Tests E2E Playwright (3 parcours démo + scan a11y axe-core, bloquant
  # sur impact=critical). Job séparé : Chromium ~150 MB, plus lent.
  # ──────────────────────────────────────────────────────────────────
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright Chromium + WebKit
        run: npx playwright install --with-deps chromium webkit
      # 🔴 `supabase-stub` DOIT figurer ici. Il utilise Desktop Chrome, donc
      # l'installation ci-dessus suffit, et il porte les parcours qui ne sont
      # PAS atteignables en mode démo (`FirstRunSetup`, retour OAuth) : le
      # laisser hors de la CI reviendrait à poser sur `main` des gardes qui ne
      # tournent nulle part — la faute que ce dépôt s'est déjà faite deux fois.
      #
      # 🔴 `mobile-safari` A REJOINT CETTE LIGNE LE 2026-09-15 (C-78), et il y
      # manquait depuis la CRÉATION de ce job, le 2026-06-06 (`a163c2b3`). Le
      # project, lui, existe depuis le 2026-05-21 : **trois mois sans jamais
      # tourner**, soit 96 cas sur 220 joués par aucun des neuf workflows.
      #
      # Ce qui était sans filet : les feuilles mobiles, les gestes tactiles,
      # `reduced-motion-sheets`, les cibles tactiles WCAG et les deux suites
      # d'accessibilité au clavier. Donc tout le périmètre iOS Safari, et le
      # moteur sur lequel tourne VoiceOver.
      #
      # ⚠️ Le motif de l'exclusion (« WebKit, ~1 min d'installation en plus »)
      # était écrit TROIS LIGNES sous la règle inverse, posée pour
      # `supabase-stub` dans le même diff. Le raisonnement juste et son
      # exception ont vécu côte à côte pendant dix jours.
      #
      # ⚠️ L'ordre des `--project` compte : `workers: 1` et
      # `fullyParallel: false` les jouent l'un après l'autre, donc `chromium`
      # chauffe le serveur du port 3000 avant que WebKit n'y touche. Le project
      # `mobile-safari-warmup` rend ce bénéfice explicite au lieu de le faire
      # dépendre de l'ordre.
      #
      # 🔴 `mobile-chrome` A REJOINT CETTE LIGNE LE 2026-09-20 (C-97). Jusque-là
      # tout ce que le dépôt mesurait en mobile tournait sur UN modèle
      # (iPhone 12), UN moteur (WebKit), et AUCUN Android — alors que Chrome
      # Android est le premier navigateur mobile du marché.
      #
      # Il porte ce que WebKit ne peut pas porter : le mode PAYSAGE, une taille
      # de police système à 200 %, et surtout un CPU BRIDÉ par CDP, protocole
      # que WebKit n'expose pas. Sans ce dernier, la classe de défaut de C-68
      # (fil principal bloqué 3 637 ms sur 4 000) reste hors de portée de la
      # CI : elle avait été trouvée à la main.
      - name: Run E2E (Chromium + supabase-stub + mobile-safari + mobile-chrome)
        run: >-
          npx playwright test
          --project=chromium --project=supabase-stub
          --project=mobile-safari --project=mobile-chrome
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────
  # Lighthouse CI — LCP / TBT / CLS / a11y / SEO par route publique.
  #
  # Comblé le 2026-08-24. `docs/PERFORMANCE.md` listait « Lighthouse CI
  # toujours absent » depuis l'audit perf du 2026-05-29 : AUCUN job ne mesurait
  # les Core Web Vitals, alors que le budget bundle, lui, était surveillé. On
  # gardait donc un oeil sur ce qu'on expédie et aucun sur ce que ça donne.
  #
  # Périmètre : les routes PRÉRENDUES uniquement. Les routes protégées
  # demandent une session, donc un parcours de connexion — ce serait un job
  # Playwright, pas Lighthouse.
  #
  # ⚠️ SEUILS PROVISOIRES, à resserrer après la PREMIÈRE mesure réelle.
  # Ils n'ont pas pu être posés « au réel mesuré » comme le reste des budgets
  # du dépôt : Lighthouse a besoin d'un Chrome exécutable, absent de la machine
  # de développement. Ils sont donc prudents à dessein. Le jour où le premier
  # run donne les vrais chiffres, RABAISSER `lighthouserc.json` juste en
  # dessous — un budget très au-dessus du réel ne mesure rien.
  #
  # Bloquant sur a11y, SEO et CLS (des régressions franches, faciles à
  # attribuer). Avertissement sur la performance : elle varie avec le runner,
  # et une gate rouge en permanence finit ignorée — c'est la règle du dossier.
  # ──────────────────────────────────────────────────────────────────
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci

      # Le prérendu fait partie du build : sans lui, les routes publiques
      # renvoient la coquille SPA et Lighthouse mesurerait une page vide.
      #
      # 🔴 Après le Build, chaque étape porte `!cancelled()` : un `check:seo`
      # rouge masquait jusqu'ici le volume i18n ET la passe Lighthouse desktop
      # (même défaut que `lint-test-build` le 2026-10-12). Les lectrices de
      # `dist/` dépendent du Build, chaque assert de SON collect.
      - name: Build (avec prérendu)
        id: build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # 🔴 SANS cette variable, la CI ne mesure PAS le bundle qui part en
          # production. `main.tsx` garde son `Sentry.init` derriere
          # `if (sentryDsn)` ; Vite remplace la variable absente par `undefined`
          # a la compilation, la branche devient du code mort, et Rollup jette
          # presque tout `@sentry/react`. Mesure du 2026-09-02, meme arbre et
          # meme node_modules, seule la variable change :
          #     avec DSN  -> vendor-sentry 145 740 o brut, 49 276 o gzip
          #     sans DSN  -> vendor-sentry  11 633 o brut,  3 818 o gzip
          # La garde de budget sous-estimait donc le chemin critique reel de
          # ~45 ko gzip, et les attributions de bootup du job `lighthouse`
          # etaient structurellement AVEUGLES a Sentry. Vercel, lui, construit
          # avec la variable posee.
          # La valeur n'a pas besoin d'etre un vrai DSN : seule sa presence
          # decide de la forme du bundle, et cet artefact n'est jamais deploye.
          # ⚠️ Ici, PAS de valeur de repli — asymetrie voulue, et payee une fois.
          # Le job `lint-test-build` PESE l'artefact : un faux DSN y suffit, rien
          # ne s'execute. Ce job-ci EXECUTE la page. Avec un DSN bidon, Sentry
          # s'initialise vraiment et tente d'emettre vers un hote qui n'existe
          # pas ; la console se remplit d'erreurs et « best practices » tombe de
          # 100 a 96 sur les QUATRE pages, sous le seuil de 0,97. Mesure du
          # 2026-09-02, run 33671417915, rouge a cause de ce repli.
          # Sans secret pose, ce build reste donc sans Sentry : les attributions
          # de bootup restent aveugles a lui, et c'est ecrit noir sur blanc
          # plutot que corrige par un faux qui fausserait le score.
          VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}

      # C-98 — rien ne reliait le SITEMAP aux pages réellement PRÉRENDUES, et
      # aucune garde ne vérifiait les balises par page. Une route ajoutée à
      # l'un sans l'autre ne faisait échouer aucun job ; le 2026-09-14, dix
      # pages prérendues hors sitemap ont dû être expliquées À LA MAIN.
      #
      # Ici plutôt que dans `lint-test-build` : la garde lit `dist/**`, et ce
      # job est le seul qui construise AVEC le prérendu déjà en place.
      - name: Sitemap, prerendu et balises par page
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run check:seo

      # C-99, SECONDE MOITIÉ — le volume de texte indexable par page ET par
      # locale. Les 50 pages avaient été mesurées UNE fois avant l'ouverture
      # d'`en` à l'indexation (C-20), jamais depuis. Une traduction tronquée
      # ne casse rien : la page s'affiche, le prérendu tourne, `i18n:check`
      # est vert. Google, lui, la traite comme du contenu mince.
      # ⚠️ Les slugs LOCALISÉS sont appariés par `route-slugs.json` : sans ça
      # le rapport fr↔en ne se calculerait jamais sur les neuf pages
      # éditoriales, c'est-à-dire celles qui portent le contenu.
      - name: i18n · volume de texte par page et par locale
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: npm run i18n:pages -- --pages

      # Quel Chrome, et existe-t-il ? Une phase `collect` qui ne produit AUCUN
      # rapport echoue le plus souvent avant d'ouvrir un navigateur, et la
      # difference entre « Chrome absent » et « Chrome refuse de demarrer » ne
      # se devine pas depuis l'exterieur. Trois lignes dans le resume valent
      # mieux qu'une hypothese.
      - name: Chrome disponible ?
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          VU=""
          for BIN in google-chrome google-chrome-stable chromium chromium-browser; do
            P=$(command -v "$BIN" 2>/dev/null) && VU="$VU $BIN=$("$BIN" --version 2>&1 | head -1)"
          done
          echo "::notice title=chrome::${VU:-aucun binaire Chrome trouve} | CHROME_PATH=${CHROME_PATH:-vide}"
          {
            echo '### Chrome vu par le job lighthouse'
            echo ''
            echo '```'
            for BIN in google-chrome google-chrome-stable chromium chromium-browser; do
              P=$(command -v "$BIN" 2>/dev/null) && echo "$BIN -> $P ($("$BIN" --version 2>&1 | head -1))"
            done
            echo "CHROME_PATH=${CHROME_PATH:-<vide>}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # ⚠️ Le log d'un run exige une authentification, meme sur un depot public,
      # et le RESUME du job ne l'exige pas. Sans ce report, un echec ici n'affiche
      # que « Process completed with exit code 1 » : c'est exactement ce qui a
      # rendu ce job indiagnosticable depuis son ajout le 2026-08-24, et ce qui a
      # fait porter la tache T-50 sur un `gh auth login` au lieu d'un correctif.
      # Meme dispositif que le replay de migrations, pour la meme raison.
      # ⚠️ `autorun` enchaine collect → assert → upload, donc une assertion
      # rouge empeche l upload : le job qui MESURE ne rend alors AUCUN chiffre,
      # exactement quand on en a besoin. Les trois phases sont donc separees,
      # et le releve des scores tourne en `always()`. Sans ca, T-28 (resserrer
      # les seuils sur le reel) ne peut jamais lire le reel.
      - name: Lighthouse collect
        id: lhci-desktop
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.15.x collect 2>&1 | tee lhci.log

      - name: Scores mesures
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const d = ".lighthouseci";
            if (!fs.existsSync(d)) { console.log("::warning title=lhci::aucun rapport produit"); process.exit(0); }
            const lignes = [];
            for (const f of fs.readdirSync(d).filter((f) => f.startsWith("lhr-") && f.endsWith(".json"))) {
              const r = JSON.parse(fs.readFileSync(`${d}/${f}`, "utf8"));
              const c = r.categories;
              const n = (k) => (c[k] ? Math.round(c[k].score * 100) : "-");
              lignes.push(`${r.finalDisplayedUrl} perf=${n("performance")} a11y=${n("accessibility")} bp=${n("best-practices")} seo=${n("seo")} lcp=${Math.round(r.audits["largest-contentful-paint"].numericValue)}ms tbt=${Math.round(r.audits["total-blocking-time"].numericValue)}ms cls=${r.audits["cumulative-layout-shift"].numericValue}`);
            }
            for (const l of lignes) console.log(`::notice title=lhci-score::${l}`);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Scores Lighthouse\n\n\`\`\`\n${lignes.join("\n")}\n\`\`\`\n`);
          '

      # T-51 : un SCORE dit qu'une page est lente, jamais ce qui la ralentit.
      # Mesure du 2026-08-30 : sur un poste de developpement, la landing (55 en
      # CI) et le guide (96 en CI) rendent le MEME score, parce que la charge de
      # la machine domine tout. L'ecart ne se reproduit que sur ce runner, donc
      # c'est ici, et nulle part ailleurs, qu'il faut lire l'attribution.
      #
      # `NL` plutot qu'une sequence d'echappement : ce bloc traverse YAML puis
      # le shell avant d'atteindre node, et un antislash n'y survit pas toujours.
      - name: Repartition du fil principal
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const NL = String.fromCharCode(10);
            const d = ".lighthouseci";
            if (!fs.existsSync(d)) process.exit(0);
            const bloc = ["### Ou passe le fil principal", ""];
            const notes = [];
            for (const f of fs.readdirSync(d).filter((x) => x.startsWith("lhr-") && x.endsWith(".json"))) {
              const r = JSON.parse(fs.readFileSync(d + "/" + f, "utf8"));
              const boot = (r.audits["bootup-time"].details?.items ?? []).slice(0, 6)
                .map((i) => (String(i.url).split("/").pop() || "(document)") + " " + Math.round(i.total) + "ms");
              const fil = (r.audits["mainthread-work-breakdown"].details?.items ?? [])
                .map((i) => i.groupLabel + " " + Math.round(i.duration) + "ms");
              bloc.push("**" + r.finalDisplayedUrl + "**", "", "- bootup : " + boot.join(" · "), "- fil : " + fil.join(" · "), "");
              notes.push(r.finalDisplayedUrl + " | " + boot.slice(0, 3).join(" · "));
            }
            for (const n of notes.slice(0, 8)) console.log("::notice title=lhci-bootup::" + n);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, bloc.join(NL) + NL);
          '

      - name: Lighthouse assert
        if: ${{ !cancelled() && steps.lhci-desktop.outcome == 'success' }}
        run: |
          set -o pipefail
          if npx --yes @lhci/cli@0.15.x assert 2>&1 | tee -a lhci.log; then exit 0; fi
          {
            echo '### ✖ Lighthouse CI : echec'
            echo ''
            echo '```'
            tail -n 80 lhci.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # ⚠️ Le resume de job n'est PAS expose par l'API : il se lit dans
          # l'interface, donc par un humain connecte. Les ANNOTATIONS, elles, se
          # lisent sans authentification sur un depot public. On emet donc les
          # dernieres lignes en annotation : c'est la seule forme de diagnostic
          # qu'un agent sans compte GitHub puisse relire.
          tail -n 25 lhci.log | while IFS= read -r LIGNE; do
            case "$LIGNE" in *LH:status*) continue;; esac
            echo "::error title=lhci::${LIGNE}"
          done
          exit 1

      - name: Upload Lighthouse reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse
          path: .lighthouseci/
          # Dossier CACHÉ : sans ce drapeau, upload-artifact l'ignore en silence
          # (« No files were found »), et aucun rapport n'a jamais été archivé.
          include-hidden-files: true
          retention-days: 7

      # ═══ C-84 · LA PASSE MOBILE ════════════════════════════
      #
      # 🔴 Jusqu'au 2026-09-20, la SEULE mesure continue de perf, d'a11y et de
      # SEO en conditions reelles tournait en preset DESKTOP. Elle ignorait donc
      # le terminal du trafic vise, et ne pouvait structurellement pas voir la
      # classe de defaut de C-68 : un preset desktop ne bride ni le CPU ni le
      # reseau.
      #
      # `!cancelled()` sur le collect : la passe desktop peut echouer sur une
      # assertion, et c'est exactement le moment ou l'on veut AUSSI le chiffre
      # mobile. Meme raison que la separation collect/assert/upload au-dessus.
      - name: Lighthouse collect (mobile)
        id: lhci-mobile
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          set -o pipefail
          npx --yes @lhci/cli@0.15.x collect --config=lighthouserc.mobile.json 2>&1 | tee lhci-mobile.log

      - name: Scores mesures (mobile)
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs");
            const NL = String.fromCharCode(10);
            // 🔴 C-116 · `.lighthouseci`, PAS `.lighthouseci-mobile` : ce dernier
            // n est ecrit que par un `lhci upload`, qui n existe pas pour la passe
            // mobile. Le resume ecrivait donc « aucun rapport mobile produit »
            // depuis sa pose (2026-09-20), alors que le LCP mobile etait MAUVAIS
            // sur les 8 URLs : mesure, et lu par personne. Le collect mobile
            // remplace le dossier du collect desktop, donc ce qu on lit ici est
            // bien la passe mobile.
            const d = ".lighthouseci";
            if (!fs.existsSync(d)) { console.log("::error title=lhci-mobile::aucun rapport mobile produit"); process.exit(1); }
            const lignes = [];
            for (const f of fs.readdirSync(d).filter((f) => f.startsWith("lhr-") && f.endsWith(".json"))) {
              const r = JSON.parse(fs.readFileSync(d + "/" + f, "utf8"));
              const c = r.categories;
              const n = (k) => (c[k] ? Math.round(c[k].score * 100) : "-");
              // L element LCP et ses phases : sans eux, un LCP a 6 s ne dit pas
              // s il attend le reseau, le JS ou une police.
              // 🔴 UNE ligne par URL, pas trois : GitHub ne garde que DIX
              // annotations par etape. Le 2026-10-22, 8 URLs x 3 lignes en
              // perdaient quatorze, dont l element LCP de `/en/` (le bandeau
              // cookies, lu dans l artefact). « detache » = l element a quitte
              // le DOM, c est le cas normal de la copie `#lp-hero`.
              const el = r.audits["largest-contentful-paint-element"];
              const items = (el && el.details && el.details.items) || [];
              const noeud = items[0] && items[0].items && items[0].items[0] && items[0].items[0].node;
              const phases = items[1] && items[1].items ? items[1].items.map((p) => p.phase + "=" + Math.round(p.timing) + "ms").join(" ") : "";
              lignes.push(r.finalDisplayedUrl + " perf=" + n("performance") + " a11y=" + n("accessibility") +
                " bp=" + n("best-practices") + " seo=" + n("seo") +
                " lcp=" + Math.round(r.audits["largest-contentful-paint"].numericValue) + "ms" +
                " tbt=" + Math.round(r.audits["total-blocking-time"].numericValue) + "ms" +
                " cls=" + r.audits["cumulative-layout-shift"].numericValue +
                " | LCP " + (noeud ? (noeud.selector || noeud.snippet || "?").slice(0, 90) : "detache") +
                (phases ? " | " + phases : ""));
            }
            if (lignes.length === 0) { console.log("::error title=lhci-mobile::dossier present mais aucun lhr-*.json"); process.exit(1); }
            for (const l of lignes) console.log("::notice title=lhci-mobile::" + l);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
              "### Scores Lighthouse — MOBILE" + NL + NL + "```" + NL + lignes.join(NL) + NL + "```" + NL);
          '

      - name: Lighthouse assert (mobile)
        if: ${{ !cancelled() && steps.lhci-mobile.outcome == 'success' }}
        run: |
          set -o pipefail
          if npx --yes @lhci/cli@0.15.x assert --config=lighthouserc.mobile.json 2>&1 | tee -a lhci-mobile.log; then exit 0; fi
          {
            echo '### ✖ Lighthouse CI MOBILE : echec'
            echo ''
            echo '```'
            tail -n 80 lhci-mobile.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          tail -n 25 lhci-mobile.log | while IFS= read -r LIGNE; do
            case "$LIGNE" in *LH:status*) continue;; esac
            echo "::error title=lhci-mobile::${LIGNE}"
          done
          exit 1

      - name: Upload Lighthouse reports (mobile)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lighthouse-mobile
          path: .lighthouseci/
          # Dossier CACHÉ : sans ce drapeau, upload-artifact l'ignore en silence
          # (« No files were found »), et aucun rapport n'a jamais été archivé.
          include-hidden-files: true
          retention-days: 7
