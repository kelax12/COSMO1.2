# ⚠️ TEMPORAIRE · preuve de la PR « instables mobile-safari » (2026-10-22).
# Rejoue les quatre cas corrigés cinq fois sous WebKit, SANS retry : un seul
# instable se lit comme un échec. À RETIRER avant la fusion.
name: tmp-webkit-repeat
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  repeat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps webkit
      - name: Quatre cas x5, mobile-safari, retries 0
        run: >-
          npx playwright test --project=mobile-safari --retries=0 --repeat-each=5 --trace=retain-on-failure
          e2e/demo-entreprise-okr-modal.spec.ts:51
          e2e/demo-entreprise.spec.ts:16
          e2e/demo-touch-gestures.spec.ts:60
          e2e/demo-journeys.spec.ts:22
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      - name: Rapport et traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tmp-webkit-repeat
          path: |
            playwright-report/
            test-results/
          retention-days: 7
