version: 2
updates:
  # ── npm dependencies ────────────────────────────────────────────────
  # Weekly security + version updates. Prod deps surface individually so a
  # CVE bump (react-router, ws, …) is easy to review; dev/test deps are
  # grouped to cut PR noise.
  #
  # `cooldown` : on n'accepte pas une version publiée il y a deux heures.
  # C'est la fenêtre exploitée par les compromissions de mainteneurs (chalk /
  # debug, sept. 2025), et les alertes de sécurité (Dependabot, seules depuis
  # le retrait de `npm audit` de la CI le 2026-11-08) ne la voient PAS : elles
  # se basent sur les avis publiés, or une version malveillante fraîche n'en a
  # encore aucun. Deux débouchés qu'on
  # ferme ici : le `postinstall` qui s'exécute sur la machine du dev (avec
  # .env et .env.cosmo-cli à portée), et le bundle client livré par Vercel.
  # 7 jours et pas plus : au-delà on retarderait aussi les correctifs. Les
  # *security updates* Dependabot ne sont pas soumis au cooldown, donc les
  # CVE continuent de passer immédiatement.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 8
    labels:
      - dependencies
    # Majeures écartées par ADR : sans ces lignes elles reviennent chaque lundi.
    # Rouvrir = lire la section « Ce qui rouvre la décision » de l'ADR, puis retirer la ligne.
    ignore:
      - dependency-name: "framer-motion"        # ADR 0018
        update-types: ["version-update:semver-major"]
      - dependency-name: "lucide-react"         # ADR 0017
        update-types: ["version-update:semver-major"]
      - dependency-name: "@fullcalendar/*"      # ADR 0016
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"          # ADR 0019
        update-types: ["version-update:semver-major"]
      # react-virtual est épinglé à 3.14.9 (exact) : la 3.14.26 (virtual-core 3.17.x)
      # fait passer vendor-virtual de 7,6 à 10,0 ko gzip, au-delà de son cliquet
      # (check:bundle rouge, mesuré le 2026-11-20). Retirer cette ligne et l'épinglage
      # quand une version repasse sous 7,6 ko, sans relever le plafond.
      - dependency-name: "@tanstack/react-virtual"
        update-types: ["version-update:semver-minor", "version-update:semver-patch"]
    groups:
      dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch
      prod-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  # ── GitHub Actions ──────────────────────────────────────────────────
  # Les `uses:` de ci.yml sont pinnés par SHA (cf. l'en-tête du workflow) :
  # Dependabot bumpe le SHA et met à jour le commentaire `# vX.Y.Z`. Même
  # cooldown — une action repointée est exactement le risque qu'on pinne.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels:
      - ci
    # `init` et `analyze` de codeql-action doivent porter la MEME version :
    # `analyze` refuse une configuration ecrite par un `init` d'une autre
    # version (« Loaded a configuration file for version '4.38.3', but running
    # version '4.38.1' »). Bumpees separement (PR n° 80 et 82, 2026-10-19),
    # chacune etait rouge sur CodeQL par construction. Un seul PR pour les deux.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"
